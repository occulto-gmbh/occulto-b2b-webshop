query CartValidationsGenerateRunInput {
  cart {
    # Setzt die Vororder-Maske im Theme. Steht hier etwas drin, gilt
    # zusaetzlich die Mindestmenge je Position.
    vororder: attribute(key: "Vororder") {
      value
    }
    lines {
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          title
          availableQuantityMetafield: metafield(
            namespace: "app--416332316673"
            key: "available_quantity"
          ) {
            value
          }
          product {
            title
          }
        }
      }
    }
  }
  buyerJourney {
    step
  }
}
