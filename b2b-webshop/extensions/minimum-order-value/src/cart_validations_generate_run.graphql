query CartValidationsGenerateRunInput {
  cart {
    buyerIdentity {
      customer {
        isDealer: hasAnyTag(tags: ["dealer-approved"])
      }
    }
    lines {
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            isSingleItem: hasAnyTag(tags: ["einzelstueck"])
          }
        }
      }
    }
  }
  buyerJourney {
    step
  }
}
