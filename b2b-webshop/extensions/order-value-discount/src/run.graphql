query RunInput {
  cart {
    # Einzelstücke zählen nicht zur Packmenge und werden nicht rabattiert.
    lines {
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            isSingleItem: hasAnyTag(tags: ["einzelstueck", "filialversand-zuschlag"])
          }
        }
      }
    }
  }
}
